<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="TruthShield AI Animated Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#09152E" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="titleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="35%" stop-color="#00B4D8" />
      <stop offset="65%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="8" y="8" width="1184" height="344" rx="20" />
    </clipPath>

    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SFMono-Regular', 'Courier New', monospace; }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseSoft {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -48; }
      }
      @keyframes badgeGlow1 {
        0%, 100% { opacity: 0.72; stroke: #1E3A5F; }
        25% { opacity: 1; stroke: #22D3EE; }
        50% { opacity: 0.72; stroke: #1E3A5F; }
      }
      @keyframes badgeGlow2 {
        0%, 25%, 100% { opacity: 0.72; stroke: #1E3A5F; }
        50% { opacity: 1; stroke: #22D3EE; }
        75% { opacity: 0.72; stroke: #1E3A5F; }
      }
      @keyframes badgeGlow3 {
        0%, 50%, 100% { opacity: 0.72; stroke: #1E3A5F; }
        75% { opacity: 1; stroke: #22D3EE; }
      }

      .ringOuter { transform-box: fill-box; transform-origin: center; animation: spinSlow 22s linear infinite; }
      .ringInner { transform-box: fill-box; transform-origin: center; animation: spinReverse 14s linear infinite; }
      .shieldPulse { transform-box: fill-box; transform-origin: center; animation: pulseSoft 3.6s ease-in-out infinite; }
      .traceLine { stroke-dasharray: 8 8; animation: flowDash 1.8s linear infinite; }
      .pill1 { animation: badgeGlow1 6s ease-in-out infinite; }
      .pill2 { animation: badgeGlow2 6s ease-in-out infinite; }
      .pill3 { animation: badgeGlow3 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="8" y="8" width="1184" height="344" rx="20" fill="url(#bgGrad)" stroke="url(#borderShine)" stroke-width="1.5" />

  <g clip-path="url(#cardClip)">
    <!-- Background Cyber Grid & Ambient Glows -->
    <rect x="8" y="8" width="1184" height="344" fill="url(#cyberGrid)" />
    <rect x="8" y="8" width="1184" height="344" fill="url(#glowCyan)" />
    <rect x="8" y="8" width="1184" height="344" fill="url(#glowBlue)" />

    <!-- Animated Vertical Forensic Scan Beam -->
    <g opacity="0.7">
      <rect x="40" y="10" width="140" height="340" fill="url(#scanBeamGrad)">
        <animate attributeName="x" values="-160;1220;-160" dur="7.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Animated Circuit Traces -->
    <path d="M 270 168 L 328 168 L 348 148 L 385 148" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-opacity="0.55" class="traceLine" />
    <path d="M 270 186 L 320 186 L 345 212 L 385 212" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.55" class="traceLine" />
    <path d="M 960 76 L 1030 76 L 1055 102 L 1140 102" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.4" class="traceLine" />

    <!-- Left Radar & TruthShield Emblem -->
    <g transform="translate(168, 174)">
      <!-- Subtle radar halo -->
      <circle cx="0" cy="0" r="108" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.22" />
      <circle cx="0" cy="0" r="92" fill="none" stroke="#00B4D8" stroke-width="1.8" stroke-dasharray="28 14 10 14" stroke-opacity="0.65" class="ringOuter" />
      <circle cx="0" cy="0" r="76" fill="none" stroke="#3B82F6" stroke-width="1.4" stroke-dasharray="12 18" stroke-opacity="0.6" class="ringInner" />

      <!-- Pulsing inner disc -->
      <circle cx="0" cy="0" r="62" fill="#0E172A" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.8" />

      <!-- Rotating radar sweep wedge -->
      <path d="M 0 0 L 0 -60 A 60 60 0 0 1 52 -30 Z" fill="#00B4D8" fill-opacity="0.14" class="ringOuter" />

      <!-- Signature Shield + Lock Logo -->
      <g class="shieldPulse">
        <path d="M 0 -42 L 34 -27 V 2 C 34 24 0 43 0 43 C 0 43 -34 24 -34 2 V -27 Z"
              fill="url(#shieldGrad)" stroke="#67E8F9" stroke-width="2" />
        <!-- Lock Shackle -->
        <path d="M -9 -6 V -14 A 9 9 0 0 1 9 -14 V -6"
              fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
        <!-- Lock Body -->
        <rect x="-13" y="-6" width="26" height="21" rx="4" fill="#FFFFFF" />
        <!-- Keyhole -->
        <circle cx="0" cy="3" r="3" fill="#0B132B" />
        <rect x="-1.4" y="4.5" width="2.8" height="5" rx="1" fill="#0B132B" />
      </g>

      <!-- Orbiting telemetry dots -->
      <circle cx="92" cy="0" r="3.5" fill="#22D3EE" class="ringOuter" />
      <circle cx="-76" cy="0" r="3" fill="#60A5FA" class="ringInner" />
    </g>

    <!-- Top Right Status Pill -->
    <g transform="translate(812, 34)">
      <rect x="0" y="0" width="346" height="32" rx="16" fill="#0E172A" stroke="#1E3A5F" stroke-width="1.2" />
      <circle cx="20" cy="16" r="5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="r" values="4.5;6;4.5" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="20.5" fill="#A7F3D0" font-size="11.5" font-weight="700" letter-spacing="0.8" class="mono">
        v2.0.0 • ZERO-AUTH DIRECT WORKSPACE
      </text>
    </g>

    <!-- Top Left Brand Tag -->
    <g transform="translate(385, 42)">
      <text x="0" y="14" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="2.2" class="mono">
        DIGITAL CONTENT PROTECTION &amp; FORENSICS
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(385, 118)">
      <text x="0" y="0" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="-1" class="sans">
        TruthShield <tspan fill="url(#titleCyan)">AI</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(385, 154)">
      <text x="0" y="0" fill="#E2E8F0" font-size="18.5" font-weight="600" class="sans">
        AI-Powered Digital Content Protection &amp; Removal Assistance Platform
      </text>
    </g>

    <!-- Tagline -->
    <g transform="translate(385, 184)">
      <text x="0" y="0" fill="#67E8F9" font-size="14.5" font-style="italic" class="sans">
        “Together for a Safer Digital World” — 100% Free, Local-First Forensic Suite
      </text>
    </g>

    <!-- Interactive Feature Pills Row -->
    <g transform="translate(385, 212)">
      <g class="pill1">
        <rect x="0" y="0" width="235" height="44" rx="10" fill="#0E172A" stroke="#1E3A5F" stroke-width="1.3" />
        <circle cx="18" cy="22" r="4" fill="#22D3EE" />
        <text x="32" y="19" fill="#F8FAFC" font-size="12.5" font-weight="700" class="sans">Multimodal Forensics</text>
        <text x="32" y="34" fill="#94A3B8" font-size="10.5" class="mono">ELA • RapidOCR • Whisper</text>
      </g>

      <g transform="translate(252, 0)" class="pill2">
        <rect x="0" y="0" width="235" height="44" rx="10" fill="#0E172A" stroke="#1E3A5F" stroke-width="1.3" />
        <circle cx="18" cy="22" r="4" fill="#60A5FA" />
        <text x="32" y="19" fill="#F8FAFC" font-size="12.5" font-weight="700" class="sans">Fernet Encrypted Vault</text>
        <text x="32" y="34" fill="#94A3B8" font-size="10.5" class="mono">AES-128-CBC • SHA-256</text>
      </g>

      <g transform="translate(504, 0)" class="pill3">
        <rect x="0" y="0" width="235" height="44" rx="10" fill="#0E172A" stroke="#1E3A5F" stroke-width="1.3" />
        <circle cx="18" cy="22" r="4" fill="#34D399" />
        <text x="32" y="19" fill="#F8FAFC" font-size="12.5" font-weight="700" class="sans">Takedown &amp; Live Verify</text>
        <text x="32" y="34" fill="#94A3B8" font-size="10.5" class="mono">PDF Dossier • SSRF Guard</text>
      </g>
    </g>

    <!-- Bottom Telemetry Ticker Bar -->
    <g transform="translate(385, 282)">
      <rect x="0" y="0" width="739" height="36" rx="8" fill="#060A17" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="22.5" fill="#22D3EE" font-size="12" font-weight="700" class="mono">STATUS:</text>
      <text x="80" y="22.5" fill="#CBD5E1" font-size="12" class="mono">
        FastAPI + Next.js 14 • Celery + Redis • Ollama Ready • No Paid API Keys Required
      </text>
      <rect x="706" y="10" width="8" height="16" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
