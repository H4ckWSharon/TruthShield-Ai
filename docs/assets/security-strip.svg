<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 124" width="1200" height="124" role="img" aria-label="TruthShield AI Security and Stack Highlights">
  <defs>
    <linearGradient id="stripBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060A17" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060A17" />
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SFMono-Regular', 'Courier New', monospace; }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .dotA { animation: blinkDot 2.2s ease-in-out infinite; }
      .dotB { animation: blinkDot 2.2s ease-in-out 0.55s infinite; }
      .dotC { animation: blinkDot 2.2s ease-in-out 1.1s infinite; }
      .dotD { animation: blinkDot 2.2s ease-in-out 1.65s infinite; }
    </style>
  </defs>

  <rect x="4" y="4" width="1192" height="116" rx="14" fill="url(#stripBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Box 1 -->
  <g transform="translate(22, 18)">
    <rect x="0" y="0" width="272" height="88" rx="10" fill="#0E172A" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#22D3EE" class="dotA" />
    <text x="34" y="29" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">SSRF &amp; Upload Defense</text>
    <text x="20" y="51" fill="#94A3B8" font-size="11.5" class="mono">DNS + IPv4/IPv6 CIDR Guard</text>
    <text x="20" y="70" fill="#67E8F9" font-size="11.5" class="mono">64KB Chunked Magic Bytes</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(316, 18)">
    <rect x="0" y="0" width="272" height="88" rx="10" fill="#0E172A" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#60A5FA" class="dotB" />
    <text x="34" y="29" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">Zero-Trust Storage</text>
    <text x="20" y="51" fill="#94A3B8" font-size="11.5" class="mono">Fernet Encrypted Evidence</text>
    <text x="20" y="70" fill="#93C5FD" font-size="11.5" class="mono">Random + Zero Byte Shredder</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(610, 18)">
    <rect x="0" y="0" width="272" height="88" rx="10" fill="#0E172A" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#A78BFA" class="dotC" />
    <text x="34" y="29" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">Multimodal Local AI</text>
    <text x="20" y="51" fill="#94A3B8" font-size="11.5" class="mono">RapidOCR • OpenCV • Whisper</text>
    <text x="20" y="70" fill="#C4B5FD" font-size="11.5" class="mono">Optional Ollama LLM / Vision</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(904, 18)">
    <rect x="0" y="0" width="274" height="88" rx="10" fill="#0E172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="24" r="5" fill="#34D399" class="dotD" />
    <text x="34" y="29" fill="#F8FAFC" font-size="14" font-weight="700" class="sans">Production Runtime</text>
    <text x="20" y="51" fill="#94A3B8" font-size="11.5" class="mono">FastAPI • Alembic • Celery</text>
    <text x="20" y="70" fill="#6EE7B7" font-size="11.5" class="mono">Next.js 14 • Docker Compose</text>
  </g>
</svg>
